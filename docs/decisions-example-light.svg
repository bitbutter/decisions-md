<svg xmlns="http://www.w3.org/2000/svg" width="860" height="635" viewBox="0 0 860 635" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <clipPath id="card">
      <rect x="0.5" y="0.5" width="859" height="634" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="860" height="635" fill="#ffffff"/>
    <rect x="0" y="0" width="860" height="52" fill="#f6f8fa"/>
    <line x1="0" y1="52" x2="860" y2="52" stroke="#d8dee4" stroke-width="1"/>

    <circle cx="26" cy="26" r="5.5" fill="#e4e8ec"/>
    <circle cx="46" cy="26" r="5.5" fill="#e4e8ec"/>
    <circle cx="66" cy="26" r="5.5" fill="#e4e8ec"/>

    <text x="92" y="31" font-size="14" fill="#57606a">DECISIONS.md</text>
    <text x="828" y="31" font-size="13" fill="#8c959f" text-anchor="end">5 decisions &#183; 3 areas</text>

    <g font-size="15">
      <text x="36" y="88" fill="#8c959f" font-weight="600">## Combat</text>

      <text x="36" y="142"><tspan fill="#0550ae" font-weight="600">DEC-COMBAT-001:</tspan><tspan fill="#1f2328"> The player sees an attack's exact damage before committing to it.</tspan></text>
      <text x="36" y="169" font-size="14" fill="#8c959f">Context: Any new modifier has to resolve to a number the UI can show before the turn is taken.</text>

      <text x="36" y="223"><tspan fill="#0550ae" font-weight="600">DEC-COMBAT-002:</tspan><tspan fill="#1f2328"> The same inputs on the same board always produce the same outcome.</tspan></text>
      <text x="36" y="250" font-size="14" fill="#8c959f">Context: Replays, the daily seed and every regression test replay a recorded run.</text>

      <text x="36" y="304" fill="#8c959f" font-weight="600">## Economy</text>

      <text x="36" y="358"><tspan fill="#0550ae" font-weight="600">DEC-ECONOMY-001:</tspan><tspan fill="#1f2328"> Gold is earned in combat only, never from exploring.</tspan></text>
      <text x="36" y="385" font-size="14" fill="#8c959f">Context: Encounter rewards are the only pacing lever; a second source breaks that.</text>

      <text x="36" y="439" fill="#8c959f" font-weight="600">## Save</text>

      <text x="36" y="493"><tspan fill="#0550ae" font-weight="600">DEC-SAVE-001:</tspan><tspan fill="#1f2328"> A save written by an older build must load in a newer one.</tspan></text>
      <text x="36" y="520" font-size="14" fill="#8c959f">Context: Players keep runs across updates; fields may be added, never removed or reused.</text>

      <text x="36" y="574"><tspan fill="#0550ae" font-weight="600">DEC-SAVE-002:</tspan><tspan fill="#1f2328"> The game never saves mid-combat.</tspan></text>
      <text x="36" y="601" font-size="14" fill="#8c959f">Context: Encounter design treats a fight as atomic; a mid-fight save would undo a bad turn.</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="859" height="634" rx="10" fill="none" stroke="#d0d7de" stroke-width="1"/>
</svg>
