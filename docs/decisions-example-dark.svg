<svg xmlns="http://www.w3.org/2000/svg" width="860" height="590" viewBox="0 0 860 590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <clipPath id="cardDark">
      <rect x="0.5" y="0.5" width="859" height="589" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardDark)">
    <rect x="0" y="0" width="860" height="590" fill="#0d1117"/>
    <rect x="0" y="0" width="860" height="52" fill="#161b22"/>
    <line x1="0" y1="52" x2="860" y2="52" stroke="#30363d" stroke-width="1"/>

    <circle cx="26" cy="26" r="5.5" fill="#30363d"/>
    <circle cx="46" cy="26" r="5.5" fill="#30363d"/>
    <circle cx="66" cy="26" r="5.5" fill="#30363d"/>

    <text x="92" y="31" font-size="14" fill="#8b949e">DECISIONS.md</text>
    <text x="828" y="31" font-size="13" fill="#6e7681" text-anchor="end">5 decisions &#183; 3 areas</text>

    <g font-size="15">
      <text x="36" y="88" fill="#6e7681" font-weight="600">## Input</text>

      <text x="36" y="142"><tspan fill="#79c0ff" font-weight="600">DEC-INPUT-001:</tspan><tspan fill="#e6edf3"> Jumping is bound to the A button.</tspan></text>
      <text x="36" y="169" font-size="14" fill="#8b949e">Context: Face buttons are reserved for actions the player uses under pressure.</text>

      <text x="36" y="223"><tspan fill="#79c0ff" font-weight="600">DEC-INPUT-002:</tspan><tspan fill="#e6edf3"> Holding a direction at the title screen does not skip the intro.</tspan></text>

      <text x="36" y="277" fill="#6e7681" font-weight="600">## Economy</text>

      <text x="36" y="331"><tspan fill="#79c0ff" font-weight="600">DEC-ECONOMY-001:</tspan><tspan fill="#e6edf3"> Coins dropped by an enemy despawn after 20 seconds.</tspan></text>
      <text x="36" y="358" font-size="14" fill="#8b949e">Context: Keeps the arena readable during a long fight.</text>

      <text x="36" y="412"><tspan fill="#79c0ff" font-weight="600">DEC-ECONOMY-002:</tspan><tspan fill="#e6edf3"> The shop never offers an item the player already owns.</tspan></text>

      <text x="36" y="466" fill="#6e7681" font-weight="600">## Save</text>

      <text x="36" y="520"><tspan fill="#79c0ff" font-weight="600">DEC-SAVE-001:</tspan><tspan fill="#e6edf3"> The game autosaves on room exit, never mid-combat.</tspan></text>
      <text x="36" y="547" font-size="14" fill="#8b949e">Context: A mid-combat save would let a player reload out of a bad turn.</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="859" height="589" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
