name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  plugin-2:
    name: plugin 2.2.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Every OS reports independently. A Windows-only launch failure is precisely
      # the class of bug this matrix exists to catch, so it must not be masked by
      # an unrelated failure elsewhere.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        # Git Bash on Windows -- the same shell Claude Code launches hooks with, so
        # the CI environment matches the one the plugin actually runs in.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Code CLI
        # Install the CLI so `claude plugin validate` is available.
        # Falls back gracefully if npm/node is not present in the runner
        # (both harnesses run independently of the CLI).
        run: |
          if command -v npm &>/dev/null; then
            npm install -g @anthropic-ai/claude-code || true
          fi

      - name: claude plugin validate
        # Validate BOTH manifests. Pointing at the repo root resolves to
        # marketplace.json (it takes precedence when present), so the plugin
        # manifest is validated explicitly by path -- otherwise a broken
        # plugin.json would sail through CI.
        #
        # No --strict. Errors fail either way; --strict only adds "warnings are
        # failures", and this repository carries three warnings it will not fix:
        # no icon, the root CLAUDE.md that the validator would rather see as a
        # skill, and the folder that holds both manifests. A job that is
        # permanently red because of those is a job nobody reads, which is how a
        # real error (the command's YAML frontmatter) sat here since 1.0.0.
        run: |
          if command -v claude &>/dev/null; then
            claude plugin validate .
            claude plugin validate .claude-plugin/plugin.json
          else
            echo "claude CLI not available; skipping plugin validate (install it locally to run)"
          fi

      - name: Hook launch harness
        # Runs the command strings from hooks.json through a real shell. Catches an
        # interpreter that is not on PATH -- a failure that is otherwise completely
        # silent at runtime.
        run: python tests/verify_hook_launch.py -v

      - name: Synthetic-payload harness
        run: python tests/verify_plugin.py -v

  v3:
    name: v3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # The engine normalises CRLF and BOM before parsing, and the state
      # directory is keyed by a hash of the project path. Both are the kind of
      # thing that works on one OS and not another, so every OS reports alone.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - name: Install
        # Dev dependencies only: typescript for the typecheck, @types/node for
        # the tests. The package itself has no runtime dependencies.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, adapter and fifth-adapter tests
        run: npm test

      - name: Conformance
        # Every fixture runs twice -- in process and through bin/decisions.ts --
        # and the two envelope sequences must be identical.
        run: npm run conformance
